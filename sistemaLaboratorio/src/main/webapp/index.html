<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Intranet - Sistema de Laboratorio</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-lg border-0">
                        <div class="card-header bg-primary text-white text-center py-3">
                            <h4>Intranet Corporativa - Laboratorio</h4>
                        </div>
                        <div class="card-body p-4">
                            <form action="LoginServlet" method="POST">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Usuario / Cédula:</label>
                                    <input type="text" name="usuario" class="form-control" placeholder="Ingrese su usuario" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Contraseña:</label>
                                    <input type="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Iniciar Sesión</button>
                            </form>
                        </div>
                        <div class="card-footer text-muted text-center py-2 small">
                            Acceso restringido para personal autorizado
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
